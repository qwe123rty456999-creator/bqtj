<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕库 · 爆枪突击字幕库</title>
<meta name="description" content="爆枪突击字幕库 —— 全部字幕文件，支持关键词搜索，点一下直接下载。">
<meta name="keywords" content="爆枪突击,字幕,字幕下载,ASS字幕,SRT字幕">
<link rel="canonical" href="https://bqtj.cc.cd/subs/">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png">
<link rel="stylesheet" href="/assets/css/style.css?v=4">
<script>
/* 提前请求字幕库索引，与 CSS/JS 并行（见首页里的同一段注释） */
window.__subsJson = fetch('/assets/data/subs.json');
</script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/">
      <img class="brand-logo" src="/assets/img/logo.png" alt="">
      <span>爆枪突击字幕库</span>
    </a>
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="菜单">菜单</button>
    <nav class="nav" id="siteNav">
      <a href="/" data-nav="home">首页</a>
      <a href="/subs/" data-nav="subs">字幕库</a>
      <a href="/about.html" data-nav="about">关于</a>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题">深色</button>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head">
      <div class="breadcrumb"><a href="/">首页</a> / 字幕库</div>
      <h1>字幕库</h1>
    </div>
  </div>

  <!-- ============================ 工具栏 ============================ -->
  <div class="toolbar">
    <div class="container">
      <div class="toolbar-row">
        <div class="search-box">
          <input type="search" id="search" autocomplete="off"
                 placeholder="搜索字幕">
          <button class="s-clear" id="clear" aria-label="清空">×</button>
        </div>

        <select class="control" id="sort">
          <option value="mtime-desc">最新上传</option>
          <option value="mtime-asc">最早上传</option>
          <option value="count-desc">下载最多</option>
          <option value="name-asc">名称 A→Z</option>
          <option value="name-desc">名称 Z→A</option>
          <option value="size-desc">体积大→小</option>
          <option value="size-asc">体积小→大</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ============================ 列表 ============================ -->
  <div class="container">
    <div class="result-info" id="info">加载中…</div>
    <div id="list"><div class="spinner"></div></div>
    <div class="pager" id="pager"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div>© <span data-year></span> 爆枪突击字幕库</div>
    <div>
      <a href="/subs/">字幕库</a> ·
      <a href="/about.html">关于</a>
    </div>
  </div>
</footer>

<script src="/assets/js/config.js?v=2"></script>
