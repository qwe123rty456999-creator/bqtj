<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕库 · 爆枪突击字幕库</title>
<meta name="description" content="爆枪突击字幕库 —— 全部字幕文件，支持关键词搜索，点一下直接下载。">
<meta name="keywords" content="爆枪突击,字幕,字幕下载,ASS字幕,SRT字幕">
<link rel="canonical" href="https://bqtj.pages.dev/subs/">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png">
<link rel="stylesheet" href="/assets/css/style.css?v=8">
<script>
/* 提前请求字幕库索引，与 CSS/JS 并行（见首页里的同一段注释） */
window.__subsJson = fetch('/assets/data/subs.json', { cache: 'no-cache' });
</script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/">
      <img class="brand-logo" src="/assets/img/logo.png" alt="">
      <span>爆枪突击字幕库</span>
    </a>
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="菜单">菜单</button>
    <nav class="nav" id="siteNav">
      <a href="/" data-nav="home">首页</a>
      <a href="/subs/" data-nav="subs">字幕库</a>
      <a href="/games/" data-nav="games">游戏</a>
      <a href="/about" data-nav="about">关于</a>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题">深色</button>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head">
      <div class="breadcrumb"><a href="/">首页</a> / 字幕库</div>
      <h1>字幕库</h1>
    </div>
  </div>

  <!-- ============================ 工具栏 ============================ -->
  <div class="toolbar">
    <div class="container">
      <div class="toolbar-row">
        <div class="search-box">
          <input type="search" id="search" autocomplete="off"
                 placeholder="搜索字幕">
          <button class="s-clear" id="clear" aria-label="清空">×</button>
        </div>

        <!-- 排序用自定义下拉（不用原生 select）：原生展开后的选项列表是系统渲染的，圆角改不了 -->
        <div class="dropdown" id="sortDrop">
          <button class="control dropdown-toggle" type="button"
                  aria-haspopup="listbox" aria-expanded="false">
            <span class="dropdown-label">最新上传</span>
            <span class="dropdown-arrow" aria-hidden="true"></span>
          </button>
          <ul class="dropdown-menu" role="listbox" hidden>
            <li class="dropdown-item" role="option" data-value="mtime-desc" aria-selected="true">最新上传</li>
            <li class="dropdown-item" role="option" data-value="mtime-asc" aria-selected="false">最早上传</li>
            <li class="dropdown-item" role="option" data-value="count-desc" aria-selected="false">下载最多</li>
            <li class="dropdown-item" role="option" data-value="name-asc" aria-selected="false">名称 A→Z</li>
            <li class="dropdown-item" role="option" data-value="name-desc" aria-selected="false">名称 Z→A</li>
            <li class="dropdown-item" role="option" data-value="size-desc" aria-selected="false">体积大→小</li>
            <li class="dropdown-item" role="option" data-value="size-asc" aria-selected="false">体积小→大</li>
          </ul>
          <input type="hidden" id="sort" value="mtime-desc">
        </div>
      </div>
    </div>
  </div>

  <!-- ============================ 列表 ============================ -->
  <div class="container">
    <div class="result-info" id="info">加载中…</div>
    <div id="list"><div class="spinner"></div></div>
    <div class="pager" id="pager"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div>© <span data-year></span> 爆枪突击字幕库</div>
    <div>
      <a href="/subs/">字幕库</a> ·
      <a href="/games/">游戏</a> ·
      <a href="/about">关于</a>
    </div>
  </div>
</footer>

<script src="/assets/js/config.js?v=3"></script>
<script src="/assets/js/site.js?v=10"></script>
<script src="/assets/js/subs.js?v=3"></script>
</body>
</html>
