<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕库 · 爆枪突击字幕库</title>
<meta name="description" content="爆枪突击字幕库 —— 整理好的字幕文件，支持关键词搜索，点一下直接下载，无提取码、不跳网盘。">
<meta name="keywords" content="爆枪突击,字幕,字幕下载,ASS字幕,SRT字幕">
<link rel="canonical" href="https://bqtj.cc.cd/subs/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/"><span class="brand-logo">📝</span><span>爆枪突击字幕库</span></a>
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="菜单">☰</button>
    <nav class="nav" id="siteNav">
      <a href="/" data-nav="home">首页</a>
      <a href="/subs/" data-nav="subs">字幕库</a>
      <a href="/about.html" data-nav="about">关于</a>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题">☀️</button>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head">
      <div class="breadcrumb"><a href="/">首页</a> / 字幕库</div>
      <h1>📝 字幕库</h1>
      <p>全部字幕文件，点「下载」即刻开始，不用提取码、不跳网盘。</p>
    </div>
  </div>

  <!-- ============================ 工具栏 ============================ -->
  <div class="toolbar">
    <div class="container">
      <div class="toolbar-row">
        <div class="search-box">
          <span class="s-icon">🔍</span>
          <input type="search" id="search" autocomplete="off"
                 placeholder="搜索字幕：集数 / 关键词，多个词用空格分隔…">
          <button class="s-clear" id="clear" aria-label="清空">✕</button>
        </div>

        <select class="control" id="sort">
          <option value="mtime-desc">最新上传</option>
          <option value="mtime-asc">最早上传</option>
          <option value="count-desc">下载最多</option>
          <option value="name-asc">名称 A→Z</option>
          <option value="name-desc">名称 Z→A</option>
          <option value="size-desc">体积大→小</option>
          <option value="size-asc">体积小→大</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ============================ 列表 ============================ -->
  <div class="container">
    <div class="result-info" id="info">加载中…</div>
    <div id="list"><div class="spinner"></div></div>
    <div class="pager" id="pager"></div>

    <div class="notice" style="margin-top:36px">
      <span>📥</span>
      <div>
        <b>批量下载：</b>浏览器一次只能下一个文件。要一次拿全部，可以装整个
        <code>files/subs/</code> 目录，或者用
        <code>wget -r -np -nH --cut-dirs=2 https://bqtj.cc.cd/files/subs/</code> 镜像下来。
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div>© <span data-year></span> 爆枪突击字幕库</div>
    <div>
      <a href="/subs/">字幕库</a> ·
      <a href="/about.html">关于</a>
    </div>
  </div>
</footer>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/subs.js"></script>
</body>
</html>
