<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爆枪突击字幕库</title>
<meta name="description" content="爆枪突击字幕库 —— 整理好的字幕文件，支持关键词搜索，点一下直接下载。">
<meta name="keywords" content="爆枪突击,字幕,字幕下载,ASS字幕,SRT字幕">
<link rel="canonical" href="https://bqtj.cc.cd/">

<meta property="og:type" content="website">
<meta property="og:title" content="爆枪突击字幕库">
<meta property="og:description" content="整理好的爆枪突击字幕文件，点一下直接下载。">
<meta property="og:url" content="https://bqtj.cc.cd/">
<meta property="og:image" content="https://bqtj.cc.cd/assets/img/favicon-180.png">
<meta name="twitter:card" content="summary">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png">
<link rel="stylesheet" href="/assets/css/style.css?v=2">
<script>
/* 把字幕库索引的请求提前发出去，与 CSS/JS 并行下载。
   否则它要等脚本都就绪后才能发出，白白多等一个往返（实测国内大概 250ms+）。
   页面脚本会用 site.js 里的 loadJSON 复用这个 Promise。 */
window.__subsJson = fetch('/assets/data/subs.json', { cache: 'no-cache' });
</script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/">
      <img class="brand-logo" src="/assets/img/logo.png" alt="">
      <span>爆枪突击字幕库</span>
    </a>
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="菜单">菜单</button>
    <nav class="nav" id="siteNav">
      <a href="/" data-nav="home">首页</a>
      <a href="/subs/" data-nav="subs">字幕库</a>
      <a href="/about.html" data-nav="about">关于</a>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题">深色</button>
    </nav>
  </div>
</header>

<main>

  <!-- ============================ 首屏 ============================ -->
  <section class="hero">
    <div class="container">
      <h1>爆枪突击字幕库</h1>
      <p class="lead">
        个人制作的字幕文件，支持关键词搜索，点击就开始下载。
      </p>

      <form class="hero-search" action="/subs/" method="get">
        <input type="search" name="q" placeholder="搜索字幕" autocomplete="off" aria-label="搜索字幕">
        <button class="btn btn-primary" type="submit">搜索</button>
      </form>
    </div>
  </section>

  <!-- ============================ 最新收录 ============================ -->
  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <h2>最新收录</h2>
          <p class="sub">按上传时间倒序</p>
        </div>
        <a class="btn btn-sm" href="/subs/">全部字幕</a>
      </div>
      <div id="latestSubs"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- ============================ 说明 ============================ -->
  <section class="section">
    <div class="container">
      <div class="notice">
        <div>
          <b>关于本站：</b>本站所有字幕均由个人制作，如需要直接下载即可。
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <div>© <span data-year></span> 爆枪突击字幕库</div>
    <div>
      <a href="/subs/">字幕库</a> ·
      <a href="/about.html">关于</a>
    </div>
  </div>
</footer>

<script src="/assets/js/config.js?v=2"></script>
<script src="/assets/js/site.js?v=3"></script>
<script>
/* 首页：最新收录 */
(async function () {
  const $latest = document.getElementById('latestSubs');

  try {
    const data = await loadJSON('/assets/data/subs.json');
    const items = data.items || [];

    if (!items.length) {
      $latest.innerHTML = `<div class="empty"><h3>字幕库还是空的</h3>
        <p>去 <a href="/admin/">上传助手</a> 传几个字幕就会出现在这里。</p></div>`;
      return;
    }

    const recent = [...items]
      .sort((a, b) => String(b.mtime || '').localeCompare(String(a.mtime || '')))
      .slice(0, 8);

    $latest.className = 'file-list';
    $latest.innerHTML = recent.map((f) => `
      <div class="file-row">
        ${f.thumb
          ? `<img class="file-thumb" src="${esc(fileUrl(f.thumb))}" alt="" loading="lazy">`
          : `<div class="file-thumb placeholder ${esc(f.ext)}">${esc(f.ext)}</div>`}
        <div class="file-main">
          <div class="file-name">${esc(f.name)}</div>
          ${f.desc ? `<div class="file-desc">${esc(f.desc)}</div>` : ''}
          <div class="file-sub">
            <span>${humanSize(f.size)}</span>
            <span>·</span>
            <span>${relTime(f.mtime)}</span>
          </div>
        </div>
        <div class="file-actions">
          <a class="btn btn-sm btn-primary" href="${esc(fileUrl(f.path))}" download>下载</a>
          ${moreMenuHTML(f)}
        </div>
      </div>`).join('');

    bindMoreMenu($latest);
    bindCopyButtons($latest);
  } catch (err) {
    renderError($latest, err);
  }
})();
</script>
</body>
</html>
