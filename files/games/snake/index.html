<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>贪吃蛇 · 小游戏</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(600px 400px at 50% 0%, #1b2440, #0b0e14 70%);
    color: #e8ebf2; font-family: system-ui, "Microsoft YaHei", sans-serif;
    user-select: none; overflow: hidden;
  }
  .wrap { text-align: center; padding: 18px; }
  h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: 1px; }
  .hint { color: #8f98ad; font-size: 13px; margin-bottom: 14px; }
  .hud {
    display: flex; justify-content: space-between; gap: 20px;
    max-width: 400px; margin: 0 auto 10px; font-size: 14px; color: #8f98ad;
  }
  .hud b { color: #7dd3fc; font-variant-numeric: tabular-nums; }
  canvas {
    background: #10141d; border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
    touch-action: none; max-width: 92vw; height: auto;
  }
  .btn {
    margin-top: 14px; padding: 9px 22px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
    color: #e8ebf2; font-size: 14px; font-family: inherit;
  }
  .btn:hover { border-color: #5b8cff; color: #5b8cff; }
  .over {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(11,14,20,.82); backdrop-filter: blur(4px); z-index: 10;
  }
  .over.show { display: grid; }
  .over .box {
    background: #151a25; border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px; padding: 30px 40px; text-align: center;
  }
  .over h2 { margin: 0 0 8px; font-size: 22px; }
  .over p { color: #8f98ad; margin: 0 0 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 贪吃蛇</h1>
  <div class="hint">方向键 / WASD 控制 · 手机可滑动屏幕</div>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高 <b id="best">0</b></span>
    <span>速度 <b id="speed">1</b></span>
  </div>
  <canvas id="cv" width="400" height="400"></canvas>
  <br>
  <button class="btn" id="restart">重新开始</button>
</div>

<div class="over" id="over">
  <div class="box">
    <h2>💀 游戏结束</h2>
    <p>本次得分 <b id="finalScore">0</b></p>
    <button class="btn" id="again">再来一局</button>
  </div>
</div>

<script>
const CELL = 20;
const COLS = 20, ROWS = 20;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const $score = document.getElementById('score');
const $best  = document.getElementById('best');
const $speed = document.getElementById('speed');
const $over  = document.getElementById('over');

let snake, dir, nextDir, food, score, best, timer, dead, speedLevel;

best = Number(localStorage.getItem('snake_best') || 0);
$best.textContent = best;

function reset() {
  snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speedLevel = 1;
  dead = false;
  placeFood();
  $score.textContent = 0;
  $speed.textContent = 1;
  $over.classList.remove('show');
  clearInterval(timer);
  schedule();
  draw();
}

function schedule() {
  clearInterval(timer);
  const interval = Math.max(60, 150 - (speedLevel - 1) * 12);
  timer = setInterval(tick, interval);
}

function placeFood() {
  const free = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
  food = free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
}

function tick() {
  if (dead) return;
  // 防止 180 度掉头
  if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    $score.textContent = score;
    if (score % 50 === 0) {
      speedLevel++;
      $speed.textContent = speedLevel;
      schedule();
    }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  dead = true;
  clearInterval(timer);
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best', best);
    $best.textContent = best;
  }
  document.getElementById('finalScore').textContent = score;
  $over.classList.add('show');
}

function draw() {
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);

  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,.035)';
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(w, i * CELL); ctx.stroke();
  }

  // 食物
  ctx.fillStyle = '#ff6b9d';
  ctx.shadowColor = '#ff6b9d';
  ctx.shadowBlur = 14;
  roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 5);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 蛇
  snake.forEach((s, i) => {
    const t = i / Math.max(1, snake.length - 1);
    ctx.fillStyle = i === 0 ? '#7dd3fc' : `hsl(${205 - t * 40} 90% ${62 - t * 22}%)`;
    roundRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, 5);
    ctx.fill();
  });

  // 眼睛
  const head = snake[0];
  ctx.fillStyle = '#0b0e14';
  const ex = head.x * CELL + CELL / 2 + dir.x * 3;
  const ey = head.y * CELL + CELL / 2 + dir.y * 3;
  ctx.beginPath();
  ctx.arc(ex - dir.y * 4, ey - dir.x * 4, 2, 0, 7); ctx.fill();
  ctx.beginPath();
  ctx.arc(ex + dir.y * 4, ey + dir.x * 4, 2, 0, 7); ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* --------------------------- 输入 --------------------------- */
const KEYS = {
  ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
  w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
};

addEventListener('keydown', (e) => {
  const d = KEYS[e.key] || KEYS[e.key.toLowerCase()];
  if (d) { e.preventDefault(); nextDir = d; }
  if (e.key === ' ' && dead) reset();
});

// 触屏滑动
let touchStart = null;
cv.addEventListener('touchstart', (e) => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

cv.addEventListener('touchmove', (e) => {
  if (!touchStart) return;
  const dx = e.touches[0].clientX - touchStart.x;
  const dy = e.touches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  nextDir = Math.abs(dx) > Math.abs(dy)
    ? { x: Math.sign(dx), y: 0 }
    : { x: 0, y: Math.sign(dy) };
  touchStart = null;
}, { passive: true });

document.getElementById('restart').addEventListener('click', reset);
document.getElementById('again').addEventListener('click', reset);

reset();
</script>
</body>
</html>
