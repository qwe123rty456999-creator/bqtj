<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打字练习 · 小游戏</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(600px 400px at 50% 0%, #241b40, #0b0e14 70%);
    color: #e8ebf2; font-family: system-ui, "Microsoft YaHei", sans-serif; padding: 20px;
  }
  .wrap { width: 100%; max-width: 680px; }
  h1 { margin: 0 0 4px; font-size: 21px; }
  .sub { color: #8f98ad; font-size: 13px; margin-bottom: 20px; }
  .hud { display: flex; gap: 26px; margin-bottom: 18px; font-size: 13.5px; color: #8f98ad; }
  .hud b { display: block; font-size: 24px; color: #7dd3fc; font-variant-numeric: tabular-nums; }
  .hud b.warn { color: #ffb454; }
  .hud b.bad { color: #ff6b9d; }
  .text {
    font-family: ui-monospace, Consolas, monospace; font-size: 21px; line-height: 1.9;
    background: #151a25; border: 1px solid rgba(255,255,255,.1); border-radius: 14px;
    padding: 22px 24px; letter-spacing: .3px; word-break: break-all; min-height: 130px;
    user-select: none;
  }
  .text span { border-radius: 3px; transition: background .1s; }
  .ok  { color: #3ddc97; }
  .bad { color: #ff6b9d; background: rgba(255,107,157,.16); text-decoration: underline wavy; }
  .cur { background: rgba(91,140,255,.35); box-shadow: 0 0 0 2px rgba(91,140,255,.5); }
  .todo { color: #626b7e; }
  input {
    width: 100%; margin-top: 16px; padding: 14px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.14); background: #151a25; color: #e8ebf2;
    font-family: ui-monospace, Consolas, monospace; font-size: 18px; outline: none;
  }
  input:focus { border-color: #5b8cff; box-shadow: 0 0 0 3px rgba(91,140,255,.16); }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button, select {
    padding: 10px 18px; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 14px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #e8ebf2;
  }
  button.primary { background: linear-gradient(135deg,#5b8cff,#a06bff); border-color: transparent; font-weight: 600; }
  button:hover { border-color: #5b8cff; }
  .done { text-align: center; padding: 20px; }
  .done h2 { font-size: 26px; margin: 0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⌨️ 打字练习</h1>
  <div class="sub">照着打，打错会标红。选难度后点开始，输入框里连续输入即可。</div>

  <div class="hud">
    <div>速度 WPM<b id="wpm">0</b></div>
    <div>正确率<b id="acc">100%</b></div>
    <div>进度<b id="prog">0/0</b></div>
    <div>用时<b id="time">0.0s</b></div>
  </div>

  <div class="text" id="text">选一个难度，然后点「开始」。</div>
  <input id="input" placeholder="在这里开始打字…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>

  <div class="row">
    <select id="level">
      <option value="en">英文单词（简单）</option>
      <option value="code">代码符号（中等）</option>
      <option value="zh">中文短句（困难）</option>
    </select>
    <button class="primary" id="start">开始</button>
    <button id="reset">重来</button>
  </div>
</div>

<script>
const POOLS = {
  en: 'the quick brown fox jumps over lazy dog while system renders beautiful interface smoothly design pattern function variable object array string boolean number return value method class module promise async await'.split(' '),
  code: 'const x = arr.map(v => v * 2);\nif (a && b) { return null; }\nfor (let i = 0; i < n; i++) {}\nconst { a, b } = obj;\ntype T = { id: number };\nconsole.log(`hi ${name}`);\nfetch("/api").then(r => r.json());',
  zh: '程序员的三件事：写文档、改文档、删文档。今天的代码明天就是遗留代码。能跑就别动它。这个需求很简单，你看着做。',
};

const $text = document.getElementById('text');
const $input = document.getElementById('input');
const $wpm = document.getElementById('wpm');
const $acc = document.getElementById('acc');
const $prog = document.getElementById('prog');
const $time = document.getElementById('time');
const $level = document.getElementById('level');

let target = '', startAt = 0, tickTimer = null, running = false;
let totalKeys = 0, wrongKeys = 0;

function pickText() {
  const lv = $level.value;
  if (lv === 'en') {
    const words = [];
    while (words.join(' ').length < 180) {
      words.push(POOLS.en[Math.floor(Math.random() * POOLS.en.length)]);
    }
    return words.join(' ');
  }
  if (lv === 'code') {
    const lines = POOLS.code.split('\n');
    const out = [];
    while (out.join('\n').length < 180) {
      out.push(lines[Math.floor(Math.random() * lines.length)]);
    }
    return out.join('\n');
  }
  const s = POOLS.zh;
  let out = '';
  while (out.length < 90) out += s;
  return out.slice(0, 90);
}

function render() {
  const typed = $input.value;
  let html = '';
  for (let i = 0; i < target.length; i++) {
    const ch = target[i] === '\n' ? '⏎\n' : target[i];
    const raw = target[i];
    if (i < typed.length) {
      const ok = typed[i] === raw;
      html += `<span class="${ok ? 'ok' : 'bad'}">${escapeHTML(ch)}</span>`;
    } else if (i === typed.length) {
      html += `<span class="cur">${escapeHTML(ch)}</span>`;
    } else {
      html += `<span class="todo">${escapeHTML(ch)}</span>`;
    }
  }
  $text.innerHTML = html;
  $prog.textContent = `${Math.min(typed.length, target.length)}/${target.length}`;

  // 实时统计
  const mins = (Date.now() - startAt) / 60000;
  if (running && mins > 0.002) {
    const correct = [...typed].filter((c, i) => c === target[i]).length;
    const wpm = Math.round((correct / 5) / mins);
    $wpm.textContent = wpm;
    $wpm.className = wpm >= 60 ? '' : wpm >= 35 ? 'warn' : 'bad';
  }
  const acc = totalKeys ? Math.round(((totalKeys - wrongKeys) / totalKeys) * 100) : 100;
  $acc.textContent = acc + '%';
  $acc.className = acc >= 95 ? '' : acc >= 85 ? 'warn' : 'bad';
}

function escapeHTML(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function start() {
  target = pickText();
  $input.value = '';
  $input.disabled = false;
  $input.focus();
  running = true;
  startAt = Date.now();
  totalKeys = 0;
  wrongKeys = 0;
  $wpm.textContent = '0';
  $acc.textContent = '100%';
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    if (running) $time.textContent = ((Date.now() - startAt) / 1000).toFixed(1) + 's';
  }, 100);
  render();
}

$level.addEventListener('change', () => reset());
document.getElementById('start').addEventListener('click', start);
document.getElementById('reset').addEventListener('click', reset);

function reset() {
  running = false;
  clearInterval(tickTimer);
  $input.value = '';
  $input.disabled = true;
  target = '';
  $text.textContent = '选一个难度，然后点「开始」。';
  $prog.textContent = '0/0';
  $wpm.textContent = '0';
  $acc.textContent = '100%';
  $time.textContent = '0.0s';
}

$input.addEventListener('input', () => {
  if (!running) return;
  const typed = $input.value;
  const last = typed.length - 1;
  if (last >= 0) {
    totalKeys++;
    if (typed[last] !== target[last]) wrongKeys++;
  }
  render();

  if (typed.length >= target.length) {
    running = false;
    clearInterval(tickTimer);
    const secs = (Date.now() - startAt) / 1000;
    const acc = Math.round(((totalKeys - wrongKeys) / totalKeys) * 100);
    $text.innerHTML = `<div class="done"><h2>🎉 打完了</h2>
      <p style="color:#8f98ad">用时 ${secs.toFixed(1)} 秒 · 正确率 ${acc}% · 速度 ${$wpm.textContent} WPM</p></div>`;
    $input.disabled = true;
    $input.value = '';
  }
});

// 禁止粘贴，不然统计没意义
$input.addEventListener('paste', (e) => e.preventDefault());
addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); start(); }
});
</script>
</body>
</html>
