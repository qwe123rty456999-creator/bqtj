<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动漫 · bqtj.cc.cd</title>
<meta name="description" content="看过的与在追的番剧整理，附带简介、标签与对应字幕入口。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/"><span class="brand-logo">📚</span><span>bqtj.cc.cd</span></a>
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="菜单">☰</button>
    <nav class="nav" id="siteNav">
      <a href="/" data-nav="home">首页</a>
      <a href="/games/" data-nav="games">小游戏</a>
      <a href="/anime/" data-nav="anime">动漫</a>
      <a href="/subs/" data-nav="subs">字幕库</a>
      <a href="/about.html" data-nav="about">关于</a>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题">☀️</button>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head">
      <div class="breadcrumb"><a href="/">首页</a> / 动漫</div>
      <h1>🎬 动漫</h1>
      <p>看过的、在追的番剧整理。每条都能直接跳到对应的字幕。</p>
    </div>
  </div>

  <div class="toolbar">
    <div class="container">
      <div class="toolbar-row">
        <div class="search-box">
          <span class="s-icon">🔍</span>
          <input type="search" id="search" autocomplete="off" placeholder="搜索番名、标签…">
          <button class="s-clear" id="clear" aria-label="清空">✕</button>
        </div>
        <select class="control" id="sort">
          <option value="date-desc">最新收录</option>
          <option value="year-desc">年份（新→旧）</option>
          <option value="year-asc">年份（旧→新）</option>
          <option value="title-asc">名称 A→Z</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="container">
    <div class="result-info" id="info">加载中…</div>
    <div id="grid"><div class="spinner"></div></div>

    <div class="notice" style="margin-top:36px">
      <span>💡</span>
      <div>
        <b>小提示：</b>点「找字幕」会带着番名跳到字幕库并自动搜索，
        前提是字幕文件名里有番名。整理字幕时保持命名规范能省很多事。
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div>© <span data-year></span> bqtj.cc.cd · 个人分享站</div>
    <div>
      <a href="/games/">小游戏</a> ·
      <a href="/anime/">动漫</a> ·
      <a href="/subs/">字幕库</a> ·
      <a href="/about.html">关于</a>
    </div>
  </div>
</footer>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/site.js"></script>
<script>
  window.COLLECTION = {
    source: '/assets/data/anime.json',
    kind: 'anime',
    placeholder: '搜索番名、标签…',
  };
</script>
<script src="/assets/js/collection.js"></script>
</body>
</html>
